<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PFG - Spring reference apps</title>
<style>
  :root {
    --bg:#0f1115; --fg:#e6e6e6; --muted:#8b95a7;
    --card:#171a21; --border:#262b36; --accent:#7aa2f7;
    --bad:#f7768e; --warn:#e0af68; --ok:#9ece6a;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-bottom: 28px; }
  .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .card .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .card .v { font-size:22px; font-weight:600; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:var(--card);
    border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:11px 14px; text-align:left; vertical-align:middle;
    border-bottom:1px solid var(--border); font-size:13px; }
  th { background:#1d212b; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:#1c212c; }
  a { color: var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.04em; }
  .pill-ok { background:#1f2a1c; color:var(--ok); }
  .pill-bad { background:#3a1d22; color:var(--bad); }
  .pill-warn { background:#3a2a16; color:var(--warn); }
  .mono, code { font-family: var(--mono); font-size:12.5px; }
  .empty { color: var(--muted); padding:14px 0; }
  footer { color: var(--muted); font-size:12px; margin-top:32px; }
</style>
</head>
<body>
<main>
  <h1>PFG - Spring reference apps</h1>
  <div class="sub">1 applications · 4 findings across 4 endpoints</div>

  <div class="grid">
    <div class="card"><div class="k">Applications</div><div class="v">1</div></div>
    <div class="card"><div class="k">Total endpoints</div><div class="v">4</div></div>
    <div class="card"><div class="k">Total findings</div><div class="v">4</div></div>
    <div class="card"><div class="k">Apps with findings</div><div class="v">1</div></div>
  </div>

  <table><thead><tr><th>Status</th><th>Application</th><th>Framework</th><th>Endpoints</th><th>Findings</th></tr></thead><tbody><tr class="row" onclick="window.location='spring_ref_min.html'"><td><span class="pill pill-bad">4 findings</span></td><td><a href="spring_ref_min.html">spring_ref_min</a></td><td class="mono">spring</td><td class="mono">4</td><td class="mono">4</td></tr></tbody></table>

  <footer>Generated by <code>pfg dashboard</code>. Click an app to open its standalone report.</footer>
</main>
</body>
</html>
