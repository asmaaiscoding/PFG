# Template manifest for a real-world Django app under evaluation.
# Copy this file into a sibling directory (one per app), rename
# the directory to your app slug, and fill in the fields below.

application: my-django-app
framework: django
repo_url: https://github.com/example/my-django-app
git_ref: 0000000000000000000000000000000000000000
fixed_commit: 1111111111111111111111111111111111111111
checkout_dir: src
source_subdir: my_django_app
license: MIT
advisory_id: GHSA-xxxx-yyyy-zzzz
advisory_url: https://github.com/example/my-django-app/security/advisories/GHSA-xxxx-yyyy-zzzz
nvd_url: https://nvd.nist.gov/vuln/detail/CVE-XXXX-NNNNN
dataset_split_group: my-django-app
label_status: advisory-confirmed

# Path (relative to this manifest.yaml) to the directory the extractor
# should walk. Usually 'src/' when the whole repository is cloned there,
# or 'src/<package>' if the extractor must start inside a package.
source_root: src/

cwe:
  - CWE-862    # Missing Authorization
  - CWE-639    # Authorization Bypass Through User-Controlled Key (IDOR)

notes: |
  Reproduces CVE-XXXX-NNNNN on /api/orders/<id>/. The view does not
  check ownership of the order and returns it for any authenticated user.

# Ground truth: every endpoint that is *expected* to be flagged.
# subtype must be one of: MISSING_AUTH | MISSING_ROLE | IDOR | COMBINED
expected_findings:
  - endpoint_id: ep_orders_detail
    subtype: IDOR
    url_pattern: /api/orders/<id>/
    cve: CVE-XXXX-NNNNN
    advisory_id: GHSA-xxxx-yyyy-zzzz
    source: https://github.com/example/my-django-app/security/advisories/GHSA-xxxx-yyyy-zzzz
    fixed_by: https://github.com/example/my-django-app/commit/1111111111111111111111111111111111111111

# Endpoints that are intentionally public (e.g. /healthz, /login).
# Predictions on these endpoint_ids are dropped before scoring (counted
# as true negatives, not false positives).
intentional_public_endpoints:
  - ep_health_check
