[project]
name = "pfg"
version = "0.1.0"
description = "Privilege Flow Graphs for detecting access-control vulnerabilities via GNNs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "PFG Thesis" }]
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "graphviz>=0.20",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torch-geometric>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow>=2.13",
]
extract = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-java>=0.21",
    "javalang>=0.13.0",
    "libcst>=1.4",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
pfg = "pfg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfg"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pfg"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "graphviz.*", "torch", "torch.*", "torch_geometric.*", "mlflow.*", "javalang.*", "tree_sitter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
